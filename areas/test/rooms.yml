- id: room
  title: "Test Room"
  description: "Deterministic room used by automated scenario tests."

- id: doorRoom
  title: "Door Test Room"
  description: "A harness room for validating locked and closed door behavior."
  metadata:
    descriptionFragments:
      - when: is_north_door_open
        text: "The north door stands open."
      - whenNot: is_north_door_open
        text: "The north door is shut and locked."
  exits:
    - roomId: test:northDoorRoom
      direction: north
  items:
    - id: test:northOpenButton
    - id: test:northCloseButton

- id: northDoorRoom
  title: "North Door Room"
  description: "A room north of the door harness with a locked default door."
  metadata:
    descriptionFragments:
      - when: is_north_door_open
        text: "The south doorway stands open from this side as well."
      - whenNot: is_north_door_open
        text: "The south doorway still looks push-through from here, even while the lock holds from the other side."
  exits:
    - roomId: test:doorRoom
      direction: south
  doors:
    test:doorRoom:
      closed: true
      locked: true

- id: virtualDoorSouthRoom
  title: "Virtual Door South Room"
  description: "A controlled room for virtual-door behavioral tests."
  metadata:
    descriptionFragments:
      - when: is_virtual_north_door_open
        text: "The north door stands open."
      - whenNot: is_virtual_north_door_open
        text: "The north door is shut and locked."
  exits:
    - roomId: test:virtualDoorNorthRoom
      direction: north
      virtualDoor: test:virtualSouthDoorFacade
  doors:
    test:virtualDoorNorthRoom:
      closed: true
      locked: true
      lockedBy: test:bronzeDoorKey
  items:
    - id: test:virtualSouthDoorFacade

- id: virtualDoorNorthRoom
  title: "Virtual Door North Room"
  description: "The north side of the virtual-door test passage."
  metadata:
    descriptionFragments:
      - when: is_virtual_south_door_open
        text: "The south passage is visibly open."
      - whenNot: is_virtual_south_door_open
        text: "The south passage is closed from this side."
  exits:
    - roomId: test:virtualDoorSouthRoom
      direction: south
  doors:
    test:virtualDoorSouthRoom:
      closed: false
      locked: false
      lockedBy: test:bronzeDoorKey

- id: lab
  title: "Test Lab"
  description: "A practice room for manually testing item pickup and placement."
  exits:
    - roomId: test:labNorth
      direction: north
    - roomId: test:labWest
      direction: west
  items:
    - id: test:labApple
    - id: test:labChest

- id: labNorth
  title: "Lab North Walk"
  description: "A narrow corridor north of the test lab."
  exits:
    - roomId: test:lab
      direction: south
    - roomId: test:labNorthWest
      direction: west

- id: labNorthWest
  title: "Lab Northwest Corner"
  description: "A quiet corner connecting the north and west passages."
  exits:
    - roomId: test:labNorth
      direction: east
    - roomId: test:labWest
      direction: south

- id: labWest
  title: "Lab West Walk"
  description: "A side corridor west of the test lab."
  exits:
    - roomId: test:labNorthWest
      direction: north
    - roomId: test:lab
      direction: east

- id: predicates
  title: "Predicate Test Room"
  description: "A deterministic benchmark room for predicate render measurements."
  metadata:
    values:
      variantPrimary: true
      variantSecondary: false
      variantNever: false
      fragmentA: true
      fragmentB: true
      fragmentC: false
      fragmentD: true
      fragmentE: false
    descriptionVariants:
      - when: bench_variant_primary
        text: "Primary benchmark variant is active."
      - when: bench_variant_secondary
        text: "Secondary benchmark variant is active."
      - when: bench_variant_never
        text: "This variant should never be selected."
    descriptionFragments:
      - when: bench_fragment_a
        text: "Fragment A contributes deterministic text."
      - when: bench_fragment_b
        text: "Fragment B contributes deterministic text."
      - when: bench_fragment_c
        text: "Fragment C should not render."
      - when: bench_fragment_d
        text: "Fragment D contributes deterministic text."
      - when: bench_fragment_e
        text: "Fragment E should not render."
  items:
    - id: test:labApple
    - id: test:labChest

- id: inlineTags
  title: "Inline Tags Room"
  description: "Base says [bench_always_true:bright|dark]. [is_button_pushed:Button is pushed.]"
  metadata:
    descriptionVariants:
      - when: bench_always_false
        text: "Variant says [bench_always_true:bright|dark]."
    descriptionFragments:
      - when: bench_always_true
        text: "Fragment says [bench_always_false:dark|bright]."
  items:
    - id: test:inlineLantern
    - id: test:inlineButtonOn
    - id: test:inlineButtonOff
