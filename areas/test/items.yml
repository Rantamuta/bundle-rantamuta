- id: rustySword
  name: "rusty sword"
  roomDesc: "A rusty sword lies here."
  description: "An old rusty sword with a chipped edge."
  keywords: [ "rusty", "sword" ]
  type: "WEAPON"

- id: oldChest
  name: "old chest"
  roomDesc: "An old chest sits here."
  description: "A heavy old chest reinforced with iron bands."
  keywords: [ "old", "chest" ]
  type: "CONTAINER"
  maxItems: 2
  metadata:
    permissions:
      verbs:
        take: "The chest is extremely heavy and attached to the floor."

- id: labApple
  name: "practice apple"
  roomDesc: "A practice apple rests here."
  description: "A plain apple used for command feel-testing."
  keywords: [ "practice", "apple" ]
  type: "OBJECT"

- id: labChest
  name: "practice chest"
  roomDesc: "A practice chest waits here."
  description: "A lightweight chest meant for put/take testing."
  keywords: [ "practice", "chest" ]
  type: "CONTAINER"
  maxItems: 4
  metadata:
    permissions:
      verbs:
        take: "You cannot take the chest. It is extremely heavy."

- id: northOpenButton
  name: "north open button"
  roomDesc: "A labeled button marked OPEN protrudes from the wall."
  description: "A sturdy brass button labeled OPEN for the north door."
  keywords: [ "north", "open", "button" ]
  type: "OBJECT"
  script: doorControlButton
  metadata:
    pushable: true
    mutationInstruction:
      type: openDoor
      direction: north
    doorContext:
      fromRoomRef: test:doorRoom
      roomRef: test:northDoorRoom
    expectedDoorState:
      closed: false
      locked: false
    roomMessages:
      currentRoom: "The north door opens."
      otherRoom: "The south door opens."

- id: northCloseButton
  name: "north close button"
  roomDesc: "A second button marked CLOSE sits beside the first."
  description: "A heavy iron button labeled CLOSE for the north door."
  keywords: [ "north", "close", "button" ]
  type: "OBJECT"
  script: doorControlButton
  metadata:
    pushable: true
    mutationInstruction:
      type: closeAndLockDoor
      direction: north
    doorContext:
      fromRoomRef: test:doorRoom
      roomRef: test:northDoorRoom
    expectedDoorState:
      closed: true
      locked: true
    roomMessages:
      currentRoom: "The north door closes."
      otherRoom: "The south door closes."
