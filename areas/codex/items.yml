- id: bronzeClapper
  name: "bronze clapper"
  roomDesc: "A bronze clapper lies half-buried in dust."
  description: "A heavy bell clapper engraved with tiny concentric circles."
  keywords: [ "bronze", "clapper" ]
  type: "OBJECT"
  script: bronzeClapperGuard

- id: waxSeal
  name: "wax seal"
  roomDesc: "A wax seal rests on a chipped stone ledge."
  description: "A circular seal of red wax marked with a faded sigil."
  keywords: [ "wax", "seal" ]
  type: "OBJECT"
  script: waxSealGuard

- id: prayerStone
  name: "prayer stone"
  roomDesc: "A smooth prayer stone sits atop a broken pew."
  description: "A palm-sized stone worn smooth by generations of hands."
  keywords: [ "prayer", "stone" ]
  type: "OBJECT"
  script: prayerStoneGuard

- id: crackedBell
  name: "cracked bell"
  roomDesc: "A cracked bell hangs in the rafters."
  description: "The old bell is split along one side, and its clapper is missing."
  keywords: [ "cracked", "bell" ]
  type: "CONTAINER"
  script: ritualPutTarget
  maxItems: 1
  metadata:
    permissions:
      verbs:
        take: "The bell is fixed to the ancient frame."
    puzzle:
      putPolicy:
        acceptedItemRef: "codex:bronzeClapper"
        descriptionEmpty: "The old bell is split along one side, and its clapper is missing."
        descriptionFilled: "The old bell is split along one side, but a bronze clapper now hangs within it."
        rejectMessage: "That does not belong in the bell."
        successRender: "The cracked bell rings clear, and the note leaves you unexpectedly uplifted."


- id: bellRope
  name: "bell rope"
  roomDesc: "A bell rope dangles from the darkness above."
  description: "A thick rope hangs from above, frayed at the end."
  keywords: ["thick", "bell", "rope" ]
  type: OBJECT  
  script: bellRopeScript
  metadata:
    pullable: true
    permissions:
      verbs:
        take: "The bell rope is securely attached, somewhere far above in the darkness."
  

- id: reliquary
  name: "ornate reliquary"
  roomDesc: "A reliquary sits in a fractured alcove."
  description: "An ornate reliquary with a shallow circular recess."
  keywords: [ "ornate", "reliquary", "shallow", "circular", "recess" ]
  type: "CONTAINER"
  script: ritualPutTarget
  maxItems: 1
  metadata:
    permissions:
      verbs:
        take: "The reliquary is set into the stonework."
    puzzle:
      putPolicy:
        acceptedItemRef: "codex:waxSeal"
        descriptionEmpty: "An ornate reliquary with a shallow circular recess awaiting its seal."
        descriptionFilled: "An ornate reliquary with a red wax seal set firmly into its shallow recess."
        roomDescEmpty: "A reliquary sits in a fractured alcove."
        roomDescFilled: "A reliquary sits in a fractured alcove, with a red wax seal set firmly into its shallow recess."
        rejectMessage: "The reliquary rejects that offering."
        successRender: "The reliquary warms beneath your hands."

- id: stoneBasin
  name: "stone basin"
  roomDesc: "A stone basin carved with runes rests in the crypt."
  description: "A circular basin whose runes seem to shimmer at the edge of sight."
  keywords: [ "stone", "basin" ]
  type: "CONTAINER"
  script: ritualPutTarget
  maxItems: 1
  metadata:
    permissions:
      verbs:
        take: "The basin is far too heavy to move."
    puzzle:
      putPolicy:
        acceptedItemRef: "codex:prayerStone"
        rejectMessage: "The basin's runes remain dark."
        successRender: "Ripples of light shimmer across the basin."

- id: resonantShard
  name: "resonant shard"
  roomDesc: "A resonant shard glitters atop a low plinth."
  description: "A palm-sized shard of smoky crystal. It vibrates with a soft, sustained tone when held near worked stone."
  keywords: [ "resonant", "shard", "crystal" ]
  type: "OBJECT"

- id: astralSignet
  name: "astral signet"
  roomDesc: "An astral signet rests in a bed of old mortar."
  description: "A small brass signet etched with seven-pointed starwork."
  keywords: [ "astral", "signet", "brass", "star", "seal" ]
  type: "OBJECT"

- id: brassIrisFacade
  name: "brass iris gate"
  roomDesc: "A brass iris gate is set into the north arch."
  description: "Nested brass petals overlap like an eyelid over the passage."
  keywords: [ "brass", "iris", "gate", "door" ]
  type: "OBJECT"
  script: facadeDoor
  metadata:
    permissions:
      verbs:
        take: "The gate is bolted into the stone ring."
    facadeDoor:
      roomId: codex:observatory_inner
      direction: north
      requiredKeyRef: codex:astralSignet
      denied:
        open: "The iris does not respond. A star-signet is required."
        lock: "You cannot find the sigil notch to set the lock."
        unlock: "The lock refuses your hand without a star-signet."
      remote:
        open: "From the far side, the south iris petals glide open."
        close: "From the far side, the south iris petals seal shut."
        lock: "From the far side, tiny lock pins click into place."
        unlock: "From the far side, the lock pins withdraw with a soft tick."
      flavor:
        open: "{actor.You} {verb:guide} the brass iris open with a silver hum."
        close: "{actor.You} {verb:draw} the brass petals shut until they interlock."
        lock: "{actor.You} {verb:set} the star lock; the gate answers with a sharp click."
        unlock: "{actor.You} {verb:ease} the lock free; the brass petals loosen."

- id: starChartShutter
  name: "star-chart shutter"
  roomDesc: "A star-chart shutter spans the south arch in overlapping metal leaves."
  description: "A fitted shutter engraved with constellations and directional glyphs."
  keywords: [ "star", "chart", "shutter", "door", "constellation" ]
  type: "OBJECT"
  script: facadeDoor
  metadata:
    permissions:
      verbs:
        take: "The shutter is anchored to a ring of counterweights."
    facadeDoor:
      roomId: codex:observatory_foyer
      direction: south
      requiredKeyRef: codex:astralSignet
      denied:
        open: "The shutter stays sealed. A matching signet seems required."
        lock: "The lock channels do not align without the signet."
        unlock: "The lock channels resist your touch."
      remote:
        open: "From the foyer side, the north iris petals bloom open."
        close: "From the foyer side, the north iris petals close into a tight spiral."
        lock: "From the foyer side, a lock pin snaps into place."
        unlock: "From the foyer side, the lock pin releases with a soft click."
      flavor:
        open: "{actor.You} {verb:turn} the star-chart shutter and the leaves peel back in sequence."
        close: "{actor.You} {verb:fold} the shutter leaves inward until the chart seals."
        lock: "{actor.You} {verb:set} the signet and the chart-lock engages."
        unlock: "{actor.You} {verb:free} the chart-lock and the shutter relaxes."
